services:
  postgres:
    image: postgres:16-alpine
    container_name: temelashcard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-temelash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-temelashcard}
      TZ: UTC
      PGTZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - temelashcard-pgdata:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-temelash} -d ${POSTGRES_DB:-temelashcard}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  temelashcard-pgdata:
